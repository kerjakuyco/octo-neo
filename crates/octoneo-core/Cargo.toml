[package]
name = "octoneo-core"
description = "Trading core of OctoNeo: the exchange client for perpetual futures, wallet signing, indicators, news and the assistant loop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ego-tree = "0.11"
encoding_rs = "0.8.44"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
k256 = { version = "0.14", features = ["ecdsa"] }
reqwest = { version = "0.13", features = ["json", "stream", "gzip"] }
rmcp = { version = "3", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
roxmltree = "0.21.2"
rusqlite = { version = "0.43", features = ["bundled"] }
rust_decimal = "1"
scraper = { version = "0.29.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha3 = "0.12"
thiserror = "2"
tokio.workspace = true
tokio-util.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
